services:
  node:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./app:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: biblioteca
    ports:
      - "3307:3306"
    volumes:
      - ./bd/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin"]
      interval: 3s
      retries: 30
